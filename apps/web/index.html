<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E10" />

    <!-- "Add to Home Screen" support. iOS ignores <link rel="manifest">
         entirely for install metadata (name/icon/orientation) and reads
         these apple-* tags instead; the manifest below is what Android
         and desktop installs actually use. Both are kept in sync
         deliberately -- iOS needs its own tags, everyone else needs the
         manifest, neither alone covers both. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Randomster" />
    <!-- "black-translucent" draws the app's own dark background behind
         the status bar instead of Safari's default white/gray bar --
         matches this app's charcoal theme and is what makes the
         `safe-area-y` inset (see index.css) worth having: without this,
         the status bar area is opaque chrome, not page content, so there
         is nothing for that inset to protect. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Randomster</title>
  </head>
  <body class="bg-charcoal">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
