services:
  - type: web
    name: randomster-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_CALLS_APP_ID
        sync: false
      - key: CLOUDFLARE_CALLS_APP_SECRET
        sync: false
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: MODERATION_WEBHOOK_SECRET
        sync: false
      - key: NCMEC_REPORTING_ENABLED
        value: "false"
      - key: IP_HASH_SALT
        sync: false

  - type: web
    name: randomster
    runtime: static
    buildCommand: npm install && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        value: https://randomster-api.onrender.com
